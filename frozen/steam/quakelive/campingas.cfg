// campingas.cfg - Quake Live Steam config
// Load from the console with: exec campingas.cfg

// ============================================================================
// Audio and feedback
// ============================================================================

seta s_ambient "0"
seta s_musicvolume "0"
seta s_volume "0.03"
seta cg_announcer "1"
seta cg_hitBeep "2"
seta cg_killBeep "8"

// ============================================================================
// Clean competitive rendering
// ============================================================================

seta cg_simpleItems "1"
seta cg_shadows "0"
seta cg_drawGun "0"
seta cg_muzzleFlash "0"
seta cg_brassTime "0"
seta cg_blood "0"
seta cg_deadBodyDarken "1"
seta cg_playerLean "0"
seta cg_drawAmmoWarning "0"
seta cg_autoswitch "0"
seta cg_railTrailTime "1800"
seta cg_railStyle "5"
seta cg_plasmaStyle "1"

seta cg_drawCrosshair "5"
seta cg_crosshairSize "50"
seta cg_crosshairColor "25"
seta cg_crosshairPulse "1"

seta cg_fov "110"
seta cg_zoomfov "42"
seta cg_zoomToggle "0"
seta cg_zoomScaling "1"

seta r_picmip "0"
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
seta r_lodBias "-2"
seta r_dynamicLight "1"
seta r_fastSky "0"
seta r_drawSun "0"
seta r_flares "0"
seta r_enablePostProcess "1"
seta r_enableBloom "1"
seta r_gamma "1"

// ============================================================================
// Mouse and network
// ============================================================================

seta sensitivity "0.789"
seta in_mouse "2"
seta m_cpi "100"
seta m_side "0.9"
seta m_forward "1"
seta m_yaw "0.029"
seta m_pitch "0.015"
seta m_filter "0"
seta cl_mouseAccel "0"
seta cl_mouseAccelPower "2"
seta cl_mouseAccelOffset "0"
seta cl_mouseSensCap "0"

seta rate "25000"
seta cl_packetdup "1"
seta cl_timeNudge "0"
seta com_maxfps "125"

// ============================================================================
// Player and team models
// ============================================================================

seta cg_selectedPlayerName "campingas"
seta sv_hostname "campingas's Match"

seta model "mynx/pm"
seta cg_forceEnemyModel "keel/pm"
seta cg_forceTeamModel "mynx/pm"

// ============================================================================
// Video quality cycle: low -> high -> engine defaults
// ============================================================================

set QSWITCH1 "play /sound/player/sarge/fall1; r_lodBias 2; cg_simpleItems 1; r_dynamicLight 0; r_fastSky 1; r_drawSun 0; r_picmip 3; r_textureMode GL_NEAREST_MIPMAP_NEAREST; r_flares 0; r_enablePostProcess 0; r_enableBloom 0; set qcyc vstr QSWITCH2; wait 200; vid_restart"
set QSWITCH2 "play /sound/player/sarge/fall1; r_lodBias -2; cg_simpleItems 0; r_dynamicLight 1; r_fastSky 0; r_drawSun 0; r_picmip 0; r_textureMode GL_LINEAR_MIPMAP_LINEAR; r_flares 0; r_enablePostProcess 1; r_enableBloom 1; set qcyc vstr QSWITCH3; wait 200; vid_restart"
set QSWITCH3 "play /sound/player/sarge/fall1; reset r_lodBias; reset cg_simpleItems; reset r_dynamicLight; reset r_fastSky; reset r_drawSun; reset r_picmip; reset r_textureMode; reset r_flares; reset r_enablePostProcess; reset r_enableBloom; set qcyc vstr QSWITCH1; wait 200; vid_restart"
set qcyc "vstr QSWITCH1"

// ============================================================================
// Model cycles
// ============================================================================

set nmyskin1 "play /sound/player/doom/fall1; cg_forceEnemyModel doom/pm; set nmyskin vstr nmyskin2"
set nmyskin2 "play /sound/player/crash/fall1; cg_forceEnemyModel crash/pm; set nmyskin vstr nmyskin3"
set nmyskin3 "play /sound/player/keel/fall1; cg_forceEnemyModel keel/pm; set nmyskin vstr nmyskin4"
set nmyskin4 "play /sound/player/tankjr/fall1; cg_forceEnemyModel tankjr/pm; set nmyskin vstr nmyskin1"
set nmyskin "vstr nmyskin1"

set skin1 "play /sound/player/doom/fall1; model doom/pm; set skin vstr skin2"
set skin2 "play /sound/player/crash/fall1; model crash/pm; set skin vstr skin3"
set skin3 "play /sound/player/keel/fall1; model keel/pm; set skin vstr skin4"
set skin4 "play /sound/player/tankjr/fall1; model tankjr/pm; set skin vstr skin1"
set skin "vstr skin1"

// ============================================================================
// Team selection and gamma controls
// ============================================================================

set gored "team red"
set goblue "team blue"

set gam01 "play sound/weapons/change; set r_gamma 0.1; set gdn vstr gam01; set gup vstr gam02"
set gam02 "play sound/weapons/change; set r_gamma 0.2; set gdn vstr gam01; set gup vstr gam03"
set gam03 "play sound/weapons/change; set r_gamma 0.3; set gdn vstr gam02; set gup vstr gam04"
set gam04 "play sound/weapons/change; set r_gamma 0.4; set gdn vstr gam03; set gup vstr gam05"
set gam05 "play sound/weapons/change; set r_gamma 0.5; set gdn vstr gam04; set gup vstr gam06"
set gam06 "play sound/weapons/change; set r_gamma 0.6; set gdn vstr gam05; set gup vstr gam07"
set gam07 "play sound/weapons/change; set r_gamma 0.7; set gdn vstr gam06; set gup vstr gam08"
set gam08 "play sound/weapons/change; set r_gamma 0.8; set gdn vstr gam07; set gup vstr gam09"
set gam09 "play sound/weapons/change; set r_gamma 0.9; set gdn vstr gam08; set gup vstr gam10"
set gam10 "play sound/weapons/change; set r_gamma 1.0; set gdn vstr gam09; set gup vstr gam11"
set gam11 "play sound/weapons/change; set r_gamma 1.3; set gdn vstr gam10; set gup vstr gam12"
set gam12 "play sound/weapons/change; set r_gamma 1.5; set gdn vstr gam11; set gup vstr gam13"
set gam13 "play sound/weapons/change; set r_gamma 1.7; set gdn vstr gam12; set gup vstr gam14"
set gam14 "play sound/weapons/change; set r_gamma 1.9; set gdn vstr gam13; set gup vstr gam15"
set gam15 "play sound/weapons/change; set r_gamma 2.0; set gdn vstr gam14; set gup vstr gam16"
set gam16 "play sound/weapons/change; set r_gamma 2.3; set gdn vstr gam15; set gup vstr gam17"
set gam17 "play sound/weapons/change; set r_gamma 2.5; set gdn vstr gam16; set gup vstr gam18"
set gam18 "play sound/weapons/change; set r_gamma 2.8; set gdn vstr gam17; set gup vstr gam19"
set gam19 "play sound/weapons/change; set r_gamma 3.0; set gdn vstr gam18; set gup vstr gam19"
set gdn "vstr gam05"
set gup "vstr gam07"

// ============================================================================
// Chat and mouse-button helpers
// ============================================================================

set emoji00 "say ^j:^ez; set emoji vstr emoji01"
set emoji01 "say ^c:^6&; set emoji vstr emoji02"
set emoji02 "say ^b:^ig; set emoji vstr emoji00"
set emoji "vstr emoji00"

set mjump "bind MOUSE2 +moveup"
set mzoom "bind MOUSE2 +zoom"
set mfire "bind MOUSE2 +attack"
set rzoom "vstr mzoom; set zm vstr rzoom1"
set rzoom1 "vstr mjump; set zm vstr rzoom"
set zm "vstr rzoom"

// ============================================================================
// Controls
// ============================================================================

unbindall

bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"
bind TAB "+scores"
bind F1 "vote yes"
bind F2 "vote no"
bind F11 "screenshotJPEG"
bind BACKSPACE "readyup"

bind r "+moveup; +attack; wait 2; -moveup; -attack"
bind t "+forward"
bind f "+moveleft"
bind g "+back"
bind h "+moveright"

bind MOUSE1 "+attack"
bind MOUSE2 "+moveup"
bind MOUSE3 "+zoom"
bind PGUP "+speed; vstr zm"
bind PGDN "+movedown; vstr mjump"

bind SPACE "weapon 1"
bind q "weapon 2"
bind y "weapon 3"
bind MWHEELDOWN "weapon 4"
bind x "weapon 5"
bind d "weapon 5"
bind j "weapon 6"
bind c "weapon 6"
bind MWHEELUP "weapon 7"
bind w "weapon 7"
bind n "weapon 8"
bind b "weapon 8"

bind F5 "vstr gored"
bind F6 "vstr goblue"
bind F9 "vstr qcyc"

bind UPARROW "callvote map q3ctf2"
bind DOWNARROW "callvote map q3wcp9"
bind LEFTARROW "callvote map q3wcp5"
bind RIGHTARROW "callvote map 13vast"

bind WORLD_61 "vstr gup"
bind WORLD_60 "vstr gdn"
bind WORLD_59 "vstr skin"
bind WORLD_62 "vstr nmyskin"
